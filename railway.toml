# railway.toml — Konfigurasi Railpack untuk Railway.app
# File ini menggantikan nixpacks.toml karena Railway sekarang menggunakan Railpack.
# Referensi: https://docs.railway.com/reference/config-as-code

[build]
# Override seluruh build command agar menggunakan 'npm install'
# (bukan 'npm ci' default Railpack yang strict-enforce lockfile consistency)
buildCommand = "composer install --no-dev --optimize-autoloader --no-interaction && npm install --no-audit --no-fund && npm run build"

[deploy]
startCommand = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
