# railway.toml — Konfigurasi Nixpacks untuk Railway.app
# Referensi: https://docs.railway.com/reference/config-as-code

[build]
buildCommand = "composer install --no-dev --optimize-autoloader --no-interaction && rm -rf node_modules && npm install --no-audit --no-fund && npm run build"

[deploy]
# Urutan: siapkan storage → cache config → migrate (boleh gagal) → serve
startCommand = "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs && chmod -R 775 storage bootstrap/cache && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force 2>/dev/null; php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
