# railway.toml — Konfigurasi Nixpacks untuk Railway.app
# Referensi: https://docs.railway.com/reference/config-as-code

[build]
# rm -rf node_modules diperlukan untuk fix npm bug #4828 (optional native deps tidak terinstall
# dengan benar jika ada node_modules dari fase install sebelumnya)
buildCommand = "composer install --no-dev --optimize-autoloader --no-interaction && rm -rf node_modules && npm install --no-audit --no-fund && npm run build"

[deploy]
# /up adalah built-in Laravel health check route (bootstrap/app.php: health: '/up')
# Route ini return 200 tanpa butuh DB, session, atau auth — paling aman untuk healthcheck
startCommand = "php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force 2>/dev/null; php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
